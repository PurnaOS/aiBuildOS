name: ci
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  test:
    # Both runtimes, on purpose: Bun installs and orchestrates, Node runs the tests and Electron runs
    # the app (docs/architecture/ar-0001.md). A three-OS matrix because the Electron shell and the
    # OKF store's byte handling are the two things most likely to regress on one platform only.
    strategy:
      # Every OS reports its own verdict: one platform's failure cancelling the others hides
      # exactly the per-platform regressions this matrix exists to catch.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run docs:check
      - run: bun run build
      # Playwright drives the built Electron app directly — no browser download, but Linux runners
      # have no display server.
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run test:e2e
      - if: runner.os != 'Linux'
        run: bun run test:e2e
